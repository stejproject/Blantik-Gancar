<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Toko Online — Sample</title>
<style>
:root { --bg:#0f172a; --card:#1e293b; --accent:#22c55e; --text:#e2e8f0; --muted:#94a3b8; }
* { box-sizing:border-box; margin:0; padding:0; font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif; }
body { background:var(--bg); color:var(--text); min-height:100vh; }
.wrap { max-width:900px; margin:0 auto; padding:24px 16px 60px; }

/* Hero */
.hero { text-align:center; padding:40px 16px 32px; }
.hero img.logo { width:72px; height:72px; border-radius:16px; object-fit:cover; margin-bottom:14px; }
.hero h1 { font-size:1.7rem; margin-bottom:8px; letter-spacing:-.3px; }
.hero p { color:var(--muted); font-size:.9rem; max-width:420px; margin:0 auto; }

/* Grid produk */
.grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:16px; margin-top:28px; }
.product-card {
  background:var(--card); border:1px solid #334155; border-radius:14px;
  padding:18px; display:flex; flex-direction:column; gap:10px;
  transition:border-color .15s, transform .15s;
}
.product-card:hover { border-color:var(--accent); transform:translateY(-2px); }
.product-card .name { font-weight:700; font-size:1rem; }
.product-card .desc { color:var(--muted); font-size:.78rem; min-height:16px; }
.product-card .price { color:var(--accent); font-weight:700; font-size:1.1rem; margin-top:auto; }
.product-card .fee-note { color:var(--muted); font-size:.7rem; }
.product-card a.buy {
  display:block; text-align:center; background:var(--accent); color:#052e16;
  font-weight:700; font-size:.85rem; padding:11px; border-radius:9px;
  text-decoration:none; margin-top:4px;
}
.product-card a.buy:hover { opacity:.9; }

.empty, .error-box {
  text-align:center; color:var(--muted); font-size:.88rem;
  padding:40px 20px; background:var(--card); border-radius:14px; border:1px solid #334155;
  margin-top:20px;
}
.error-box { color:#fecaca; border-color:#7f1d1d; background:#7f1d1d1a; }

footer { text-align:center; color:#475569; font-size:.72rem; margin-top:40px; }

.badge-powered {
  display:inline-block; margin-top:6px; font-size:.68rem; color:var(--muted);
  border:1px solid #334155; padding:3px 10px; border-radius:99px;
}
</style>
</head>
<body>
<div class="wrap">

  <div class="hero">
    <img class="logo" id="store-logo" style="display:none" alt="">
    <h1 id="store-name">Memuat toko...</h1>
    <p id="store-sub"></p>
    <span class="badge-powered">⚡ Powered by Blantik-Gancar Checkout</span>
  </div>

  <div id="error-merchant" class="error-box" style="display:none">
    Toko tidak ditemukan.<br>
    Pastikan URL memakai parameter <code>?merchant=&lt;uid&gt;</code> yang sesuai dengan akun admin toko.
  </div>

  <div class="grid" id="product-grid"></div>

  <footer id="page-footer">© 2026</footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getFirestore, doc, getDoc, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// Sama persis dengan konfigurasi Firebase di admin.html & checkout.html —
// tiga file ini memang satu paket (project stej-checkout).
const firebaseConfig = {
  apiKey: "AIzaSyCMdMWdmLQs1H2azteEXH0ldGhKEkf1R4E",
  authDomain: "stej-checkout.firebaseapp.com",
  projectId: "stej-checkout",
  storageBucket: "stej-checkout.firebasestorage.app",
  messagingSenderId: "87920802108",
  appId: "1:87920802108:web:3253dff10f78d139f7c639"
};

const app = initializeApp(firebaseConfig);
const db  = getFirestore(app);

const params = new URLSearchParams(location.search);
const merchantId = params.get("merchant") || "";

function esc(t) { const d = document.createElement("div"); d.textContent = t == null ? "" : t; return d.innerHTML; }
function fmt(n) { return "Rp " + (n || 0).toLocaleString("id-ID"); }

async function init() {
  if (!merchantId) {
    document.getElementById("error-merchant").style.display = "block";
    document.getElementById("store-name").textContent = "Toko tidak ditemukan";
    return;
  }

  // Ambil profil toko (judul, sub-judul, logo, footer) dari settings/main —
  // dokumen yang sama yang diatur admin lewat tab "Halaman" di admin.html.
  try {
    const settingsSnap = await getDoc(doc(db, "merchants", merchantId, "settings", "main"));
    const s = settingsSnap.exists() ? settingsSnap.data() : {};
    document.getElementById("store-name").textContent = s.title || "Toko Online";
    if (s.sub) document.getElementById("store-sub").textContent = s.sub;
    if (s.logo) {
      const l = document.getElementById("store-logo");
      l.src = s.logo;
      l.style.display = "block";
    }
    if (s.footer) document.getElementById("page-footer").textContent = s.footer;
  } catch (e) {
    console.error("Gagal memuat profil toko:", e.message);
  }

  // Ambil katalog produk toko ini.
  const grid = document.getElementById("product-grid");
  try {
    const itemsSnap = await getDocs(collection(db, "merchants", merchantId, "items"));
    if (itemsSnap.empty) {
      grid.innerHTML = "";
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "Belum ada produk di toko ini.";
      grid.replaceWith(empty);
      return;
    }

    let html = "";
    itemsSnap.forEach(docSnap => {
      const it = docSnap.data();
      const checkoutLink = `checkout.html?merchant=${encodeURIComponent(merchantId)}&id=${encodeURIComponent(docSnap.id)}`;
      html += `
        <div class="product-card">
          <div class="name">${esc(it.name)}</div>
          ${it.description ? `<div class="desc">${esc(it.description)}</div>` : `<div class="desc"></div>`}
          <div class="price">${fmt(it.price)}</div>
          ${it.fee ? `<div class="fee-note">+ biaya layanan ${fmt(it.fee)}</div>` : ""}
          <a class="buy" href="${checkoutLink}">🛒 Beli Sekarang</a>
        </div>`;
    });
    grid.innerHTML = html;
  } catch (e) {
    console.error("Gagal memuat produk:", e.message);
    grid.outerHTML = `<div class="error-box">Gagal memuat katalog produk: ${esc(e.message)}</div>`;
  }
}

init();
</script>
</body>
</html>
